<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 60 60">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc6de"/><stop offset=".45" stop-color="#f27aae"/><stop offset="1" stop-color="#a8235f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#f2c45a"/><stop offset="1" stop-color="#b07a1e"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2f8"/><stop offset=".5" stop-color="#ff8cbc"/><stop offset="1" stop-color="#8e1a50"/>
    </radialGradient>
  </defs>
  <!-- page block -->
  <path d="M15 9h36a4 4 0 0 1 4 4v40a4 4 0 0 1-4 4H15z" fill="#fff4e3" stroke="#c9a77a" stroke-width="1.2"/>
  <path d="M52 13v40M49.5 12v42" stroke="#e6cfa9" stroke-width="1"/>
  <!-- cover -->
  <rect x="8" y="6" width="42" height="50" rx="5" fill="url(#cover)" stroke="#6e1440" stroke-width="2"/>
  <!-- spine -->
  <rect x="8" y="6" width="8" height="50" rx="4" fill="#9c1f57" opacity=".85"/>
  <path d="M8 16h8M8 46h8" stroke="url(#gold)" stroke-width="2.4"/>
  <!-- gold corners -->
  <g fill="url(#gold)" stroke="#8a5a12" stroke-width=".8">
    <path d="M50 6v11l-11-11z"/><path d="M50 56V45l-11 11z"/>
    <path d="M16 6h8l-8 8z"/><path d="M16 56h8l-8-8z"/>
  </g>
  <!-- emblem frame -->
  <circle cx="33" cy="31" r="11.5" fill="#6e1440" opacity=".35"/>
  <circle cx="33" cy="31" r="10" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
  <!-- dofus -->
  <path d="M33 22.5c-3.8 0-6.4 5.6-6.4 9.6 0 3.6 2.9 6.4 6.4 6.4s6.4-2.8 6.4-6.4c0-4-2.6-9.6-6.4-9.6z" fill="url(#gem)" stroke="#5c0f35" stroke-width="1"/>
  <ellipse cx="30.8" cy="27.4" rx="1.4" ry="2.4" fill="#fff" opacity=".8" transform="rotate(-20 30.8 27.4)"/>
  <!-- clasp -->
  <rect x="47" y="27" width="9" height="8" rx="2" fill="url(#gold)" stroke="#8a5a12" stroke-width=".8"/>
  <circle cx="51.5" cy="31" r="1.4" fill="#8a5a12"/>
